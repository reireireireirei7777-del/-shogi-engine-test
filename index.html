<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>棋譜ノート v0.1.1</title><style>body{font-family:system-ui,sans-serif;background:#f5f2e9;color:#26231f;margin:0;padding:15px}main{max-width:850px;margin:auto}h1{font-size:1.5rem}button,input,select,textarea{font:inherit;padding:7px;margin:3px}button{cursor:pointer}section{background:white;padding:12px;border-radius:10px;margin:10px 0}#board{display:grid;grid-template-columns:repeat(9,1fr);max-width:540px;aspect-ratio:1;background:#dcb77a;border:2px solid #654321} .cell{border:1px solid #79582c;display:flex;align-items:center;justify-content:center;padding:0;margin:0;background:transparent;font-size:clamp(15px,4vw,30px);font-weight:bold;min-width:0}.cell.selected{background:#f6e37b}.cell.target{background:#b4d4a2}.cell span{display:block}.cell .reverse{transform:rotate(180deg)}.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.muted{color:#666;font-size:.85rem}textarea{width:95%;min-height:90px}input[type=text]{max-width:95%}#records button{display:block;width:100%;text-align:left}.badge{background:#e8ebef;padding:3px 7px;border-radius:8px}#status{font-weight:bold} .hidden{display:none} </style></head><body><main><h1>☗ 棋譜ノート <small>v0.1.1 修正版</small></h1><p class="muted">棋譜・コメント・評価値はこのブラウザー内に保存。外部送信機能なし。</p><section><h2>棋譜一覧</h2><div id="records"></div><button id="new">＋ 新しい棋譜</button><button id="export">一括バックアップ</button><label>復元 <input id="importBackup" type="file" accept=".json,application/json"></label></section><section><h2>棋譜情報</h2><div class="row"><label>タイトル <input id="title" type="text" placeholder="研修会 第3局"></label><label>戦型 <input id="opening" type="text" placeholder="角換わり"></label></div><div class="row"><label>先手 <input id="black" type="text"></label><label>後手 <input id="white" type="text"></label></div><button id="save">保存</button><button id="delete">この棋譜を削除</button><p id="status"></p></section><section><h2>棋譜を登録</h2><p class="muted">盤面で駒をタップ→移動先をタップ。駒を取る・成る・持ち駒を打つ操作に対応。</p><div class="row"><button id="edit">棋譜編集モード</button><button id="replay">再生モード</button><label>暗記レベル <select id="level"><option value="1">1：符号を見て両方指す</option><option value="2">2：先手を暗記・後手自動</option><option value="3">3：後手を暗記・先手自動</option><option value="4">4：両方暗記</option></select></label></div><label>KIFテキスト貼付<textarea id="kif" placeholder="1 ７六歩(77)&#10;2 ３四歩(33)"></textarea></label><div class="row"><button id="loadKif">KIFを読み込む</button><input id="kifFile" type="file" accept=".kif,.txt,text/plain"></div></section><section><div class="row"><span id="mode" class="badge"></span><span id="turn" class="badge"></span><span id="progress" class="badge"></span></div><div id="handsWhite"></div><div id="board"></div><div id="handsBlack"></div><div class="row"><button id="start">最初へ</button><button id="back">一手戻る</button><button id="next">一手進む</button><button id="hint">ヒント</button><button id="finish">練習終了・記録</button></div><p id="message"></p><div id="moves"></div></section><section><h2>この局面のメモ</h2><p class="muted">0手目（開始局面）にも入力できます。評価値は先手視点（例：+350 / -1200）。</p><label>AI評価値（手動入力） <input id="score" type="text" placeholder="+350 または 先手5手詰"></label><br><label>コメント<textarea id="comment" placeholder="この手では▲６四歩を考えていた…"></textarea></label><button id="saveNote">局面メモを保存</button><h3>メモのある局面</h3><div id="notesList"></div></section></main><script>
'use strict';
const P={p:'歩',l:'香',n:'桂',s:'銀',g:'金',b:'角',r:'飛',k:'玉','+p':'と','+l':'杏','+n':'圭','+s':'全','+b':'馬','+r':'龍'};
const initial=()=>{let b=Array(81).fill(null);let order=['l','n','s','g','k','g','s','n','l'];for(let x=0;x<9;x++){b[x]={p:order[x],s:-1};b[72+x]={p:order[x],s:1};b[18+x]={p:'p',s:-1};b[54+x]={p:'p',s:1}}b[10]={p:'r',s:-1};b[16]={p:'b',s:-1};b[64]={p:'b',s:1};b[70]={p:'r',s:1};return {b,h:{1:{},'-1':{}},turn:1}};
let db=[],current=null,at=0,sel=null,mode='edit',mistakes=0,hintCount=0,completed=false;
const $=id=>document.getElementById(id), clone=o=>JSON.parse(JSON.stringify(o));
const make=()=>({id:crypto.randomUUID?.()||String(Date.now()+Math.random()),title:'新しい棋譜',opening:'',black:'',white:'',moves:[],notes:{},sessions:[]});
function persist(){localStorage.setItem('shogi_notes_v01',JSON.stringify(db))}function ensure(){if(!current){current=make();db.push(current)}}
function pos(){let s=initial();for(let i=0;i<at;i++)s=apply(s,current.moves[i]);return s}
function own(i,s){return s.b[i]&&s.b[i].s===s.turn}
function unpromote(p){return p.replace('+','')}
function promotable(p){return ['p','l','n','s','b','r'].includes(p)}
function zone(row,side){return side===1?row<=2:row>=6}
function movement(p,side,dx,dy){let f=side===1?1:-1;let base=unpromote(p);if(['+p','+l','+n','+s'].includes(p))base='g';if(base==='p')return dx===0&&dy===-f;if(base==='l')return dx===0&&dy*f<0;if(base==='n')return Math.abs(dx)===1&&dy===-2*f;if(base==='s')return (Math.abs(dx)===1&&Math.abs(dy)===1)||(dx===0&&dy===-f);if(base==='g')return (Math.abs(dx)<=1&&dy===-f)||(Math.abs(dx)===1&&dy===0)||(dx===0&&dy===f);if(base==='k')return Math.max(Math.abs(dx),Math.abs(dy))===1;if(base==='b')return Math.abs(dx)===Math.abs(dy)||p==='+b'&&Math.abs(dx)+Math.abs(dy)===1;if(base==='r')return dx===0||dy===0||p==='+r'&&Math.abs(dx)===1&&Math.abs(dy)===1;return false}
function sliding(p,dx,dy){let b=unpromote(p);return (b==='l'&&dx===0)||(b==='b'&&Math.abs(dx)===Math.abs(dy)&&Math.abs(dx)>1)||(b==='r'&&(dx===0||dy===0)&&Math.max(Math.abs(dx),Math.abs(dy))>1)}
function canMove(s,from,to){if(from===to||!own(from,s)||s.b[to]?.s===s.turn)return false;let x=from%9,y=Math.floor(from/9),dx=to%9-x,dy=Math.floor(to/9)-y,p=s.b[from].p;if(!movement(p,s.turn,dx,dy))return false;if(sliding(p,dx,dy)){let stepX=Math.sign(dx),stepY=Math.sign(dy),xx=x+stepX,yy=y+stepY;while(xx!==to%9||yy!==Math.floor(to/9)){if(s.b[yy*9+xx])return false;xx+=stepX;yy+=stepY}}return true}
function canDrop(s,p,to){if(s.b[to]||!(s.h[s.turn][p]>0))return false;let row=Math.floor(to/9);if(['p','l'].includes(p)&&(s.turn===1?row===0:row===8))return false;if(p==='n'&&(s.turn===1?row<=1:row>=7))return false;if(p==='p'){let col=to%9;for(let y=0;y<9;y++)if(s.b[y*9+col]?.s===s.turn&&s.b[y*9+col]?.p==='p')return false}return true}
function apply(s,m){s=clone(s);let piece;if(m.drop){piece={p:m.p,s:s.turn};s.h[s.turn][m.p]--}else{piece=s.b[m.from];if(!piece)throw Error('移動元に駒がありません');if(s.b[m.to]){let p=unpromote(s.b[m.to].p);s.h[s.turn][p]=(s.h[s.turn][p]||0)+1}s.b[m.from]=null;if(m.promote)piece.p='+'+piece.p} s.b[m.to]=piece;s.turn*=-1;return s}
function label(m,i){let side=i%2===0?'▲':'△',to=m.to,coord=(9-to%9)+['一','二','三','四','五','六','七','八','九'][Math.floor(to/9)];return `${i+1} ${side}${coord}${P[m.p]||m.p}${m.drop?'打':m.promote?'成':''}`}
function render(){ensure();$('title').value=current.title;$('opening').value=current.opening;$('black').value=current.black;$('white').value=current.white;let s=pos();$('mode').textContent=mode==='edit'?'棋譜編集':'棋譜再生・練習';$('turn').textContent=s.turn===1?'先手番':'後手番';$('progress').textContent=`${at} / ${current.moves.length}手`;$('board').innerHTML='';for(let i=0;i<81;i++){let btn=document.createElement('button');btn.className='cell'+(sel?.from===i?' selected':'');let pc=s.b[i];btn.innerHTML=pc?`<span class="${pc.s===-1?'reverse':''}">${P[pc.p]}</span>`:'';btn.onclick=()=>tap(i);$('board').append(btn)}for(let side of [-1,1]){let el=$(side===1?'handsBlack':'handsWhite');el.innerHTML=(side===1?'先手持駒：':'後手持駒：');for(let p of ['r','b','g','s','n','l','p']){let count=s.h[side][p]||0;if(!count)continue;let b=document.createElement('button');b.textContent=P[p]+'×'+count;b.onclick=()=>{if(s.turn!==side)return;sel={drop:true,p};$('message').textContent='打つ場所を選択してください'};el.append(b)}}$('moves').textContent=current.moves.map((m,i)=>i===at-1?'【'+label(m,i)+'】':label(m,i)).join('　');let note=current.notes[at]||{};$('score').value=note.score||'';$('comment').value=note.comment||'';$('notesList').innerHTML='';Object.keys(current.notes).sort((a,b)=>a-b).forEach(k=>{let n=current.notes[k];if(!n.score&&!n.comment)return;let b=document.createElement('button');b.textContent=`${k}手目 ${n.score||''} ${String(n.comment||'').slice(0,40)}`;b.onclick=()=>{at=Number(k);sel=null;render()};$('notesList').append(b)});$('records').innerHTML='';db.forEach(r=>{let b=document.createElement('button');b.textContent=(r===current?'▶ ':'')+r.title+' / '+(r.opening||'戦型未設定')+` / ${r.moves.length}手 / 練習${r.sessions.length}回`;b.onclick=()=>{current=r;at=0;sel=null;render()};$('records').append(b)});$('next').disabled=at>=current.moves.length;$('back').disabled=at===0}
function tap(to){let s=pos();if(mode==='replay'&&at>=current.moves.length)return;if(sel){let m=sel.drop?{drop:true,p:sel.p,to}:{from:sel.from,to,p:s.b[sel.from]?.p};let ok=sel.drop?canDrop(s,m.p,to):canMove(s,m.from,to);if(ok){if(!m.drop){let p=s.b[m.from].p,row1=Math.floor(m.from/9),row2=Math.floor(to/9);if(promotable(p)&&(zone(row1,s.turn)||zone(row2,s.turn))){let forced=(p==='p'||p==='l')&&(s.turn===1?row2===0:row2===8)||p==='n'&&(s.turn===1?row2<=1:row2>=7);m.promote=forced||confirm('成りますか？（OK：成る / キャンセル：成らない）')}}if(mode==='edit'){current.moves=current.moves.slice(0,at);current.moves.push(m);at++;persist();$('message').textContent='指し手を登録しました'}else{let exp=current.moves[at];if(JSON.stringify([m.from??null,m.to,m.drop||false,m.p,m.promote||false])===JSON.stringify([exp.from??null,exp.to,exp.drop||false,exp.p,exp.promote||false])){at++;$('message').textContent='正解！';autoPlay()}else{mistakes++;$('message').textContent='棋譜と異なります。もう一度試してください'}}sel=null;render();return}sel=null}if(own(to,s)){sel={from:to};$('message').textContent='移動先を選択してください'}else $('message').textContent='自分の駒を選んでください';renderBoardSelection()}
function renderBoardSelection(){document.querySelectorAll('.cell').forEach((b,i)=>b.classList.toggle('selected',sel?.from===i))}
function autoPlay(){if(mode!=='replay')return;let level=Number($('level').value);while(at<current.moves.length&&((level===2&&at%2===1)||(level===3&&at%2===0)))at++}
$('new').onclick=()=>{current=make();db.push(current);at=0;mode='edit';persist();render()};$('save').onclick=()=>{ensure();for(let [k,id] of [['title','title'],['opening','opening'],['black','black'],['white','white']])current[k]=$(id).value;persist();$('status').textContent='保存しました';render()};$('delete').onclick=()=>{if(!confirm('この棋譜を削除しますか？'))return;db=db.filter(r=>r!==current);current=db[0]||make();if(!db.length)db.push(current);at=0;persist();render()};$('saveNote').onclick=()=>{current.notes[at]={score:$('score').value,comment:$('comment').value};persist();render()};$('edit').onclick=()=>{mode='edit';sel=null;render()};$('replay').onclick=()=>{mode='replay';at=0;sel=null;mistakes=0;hintCount=0;autoPlay();render()};$('level').onchange=()=>{at=0;mistakes=0;hintCount=0;autoPlay();render()};$('start').onclick=()=>{at=0;sel=null;autoPlay();render()};$('back').onclick=()=>{at=Math.max(0,at-1);sel=null;render()};$('next').onclick=()=>{if(at<current.moves.length)at++;sel=null;render()};$('hint').onclick=()=>{if(at>=current.moves.length)return;hintCount++;$('message').textContent='次の手：'+label(current.moves[at],at)};$('finish').onclick=()=>{if(mode!=='replay')return;current.sessions.push({date:new Date().toISOString(),level:Number($('level').value),reached:at,total:current.moves.length,mistakes,hints:hintCount});persist();$('message').textContent='練習履歴を保存しました';render()};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'shogi_notes',version:1,records:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='棋譜ノート_バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBackup').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.app!=='shogi_notes'||!Array.isArray(data.records))throw Error('対応していないファイルです');if(!confirm('現在の棋譜をバックアップの内容で置き換えます。よろしいですか？'))return;db=data.records;current=db[0]||make();if(!db.length)db.push(current);at=0;persist();render()}catch(err){alert('復元失敗：'+err.message)}};
function parseKif(text){let moves=[],s=initial();for(let line of text.split(/\r?\n/)){let hit=line.match(/^\s*(\d+)\s+([▲△]?)([１-９1-9])([一二三四五六七八九])([歩香桂銀金角飛玉王と成香成桂成銀馬龍竜]+)(成|不成|打)?\s*(?:\(([1-9１-９])([1-9１-９])\))?/);if(!hit)continue;let num=Number(hit[1]);if(num!==moves.length+1)throw Error(`${num}手目：手数が連続していません`);let digit=v=>Number(v.replace(/[１-９]/g,c=>String(c.charCodeAt(0)-65296)));let to=(['一','二','三','四','五','六','七','八','九'].indexOf(hit[4]))*9+(9-digit(hit[3]));let dict={'歩':'p','香':'l','桂':'n','銀':'s','金':'g','角':'b','飛':'r','玉':'k','王':'k','と':'+p','成香':'+l','成桂':'+n','成銀':'+s','馬':'+b','龍':'+r','竜':'+r'};let p=dict[hit[5]];if(!p)throw Error(`${num}手目：駒名を解釈できません`);let m={to,p};if(hit[8]&&hit[9]){m.from=(digit(hit[9])-1)*9+(9-digit(hit[8]));if(!canMove(s,m.from,to))throw Error(`${num}手目：移動できない指し手です`);m.p=s.b[m.from].p;m.promote=hit[6]==='成'}else if(hit[6]==='打'){m.drop=true;if(!canDrop(s,p,to))throw Error(`${num}手目：持ち駒を打てません`)}else throw Error(`${num}手目：移動元がありません（同・打等は後続版で拡張）`);s=apply(s,m);moves.push(m)}if(!moves.length)throw Error('読み込める指し手がありません');return moves}
$('loadKif').onclick=()=>{try{let moves=parseKif($('kif').value);if(!confirm(`${moves.length}手を読み込みます。現在の指し手を置き換えますか？`))return;current.moves=moves;at=0;mode='edit';persist();render();$('message').textContent=`${moves.length}手を読み込みました`}catch(e){$('message').textContent='読込エラー：'+e.message}};$('kifFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;let buf=await file.arrayBuffer();let txt=new TextDecoder('utf-8',{fatal:false}).decode(buf);if(txt.includes('�')){try{txt=new TextDecoder('shift_jis').decode(buf)}catch{}}$('kif').value=txt};
try{db=JSON.parse(localStorage.getItem('shogi_notes_v01')||'[]');if(!Array.isArray(db))db=[]}catch{db=[]}current=db[0]||make();if(!db.length)db.push(current);render();
</script></body></html>
